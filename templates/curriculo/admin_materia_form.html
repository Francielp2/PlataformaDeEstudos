{% extends "usuarios/base_interno.html" %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
    <div class="page-heading">
        <h1>{{ titulo }}</h1>
        <p>Dados básicos da matéria.</p>
    </div>

    <div class="form-panel">
        <form method="post" class="form-section" novalidate>
            {% csrf_token %}
            {% include "usuarios/partials/form_campos.html" with form=form %}
            <button class="btn btn-primary" type="submit"><i class="bi bi-check2"></i> Salvar</button>
            <a class="btn btn-outline-secondary" href="{% url 'curriculo_admin:admin_materias_lista' %}">Cancelar</a>
        </form>
    </div>
{% endblock %}
