{% if messages %}
    <div class="messages">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} d-flex align-items-center gap-2 mb-3" role="alert">
                <i class="bi {% if message.tags == 'success' %}bi-check-circle{% elif message.tags == 'error' %}bi-exclamation-triangle{% else %}bi-info-circle{% endif %}"></i>
                {{ message }}
            </div>
        {% endfor %}
    </div>
{% endif %}
