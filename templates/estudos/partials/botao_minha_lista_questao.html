<form method="post" action="{% url 'estudos:alternar_questao_minha_lista' questao.pk %}" class="d-inline">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    {% if questao.pk in ids_questoes_minha_lista %}
        <button class="btn btn-sm btn-outline-secondary" type="submit">Remover da Minha Lista</button>
    {% else %}
        <button class="btn btn-sm btn-outline-primary" type="submit">Adicionar à Minha Lista</button>
    {% endif %}
</form>
