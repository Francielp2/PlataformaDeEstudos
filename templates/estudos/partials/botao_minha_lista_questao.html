{% comment %}Alterna "Minha Lista". Funciona sem JS (POST normal); com JS muda na hora (components/alternancias.js).{% endcomment %}
<form method="post" action="{% url 'estudos:alternar_questao_minha_lista' questao.pk %}" class="d-inline-flex"
      data-alternar="lista" data-ligado="{% if questao.pk in ids_questoes_minha_lista %}true{% else %}false{% endif %}"
      data-rotulo-ligado="Na Minha Lista" data-rotulo-desligado="Minha Lista"
      data-icone-ligado="bi-star-fill" data-icone-desligado="bi-star"
      data-classe-ligado="btn btn-sm btn-alternar btn-alternar--lista" data-classe-desligado="btn btn-sm btn-alternar btn-alternar--lista"
      data-titulo-ligado="Remover da Minha Lista" data-titulo-desligado="Adicionar à Minha Lista"
      data-anuncio-ligado="Adicionado à Minha Lista." data-anuncio-desligado="Removido da Minha Lista.">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    {% if questao.pk in ids_questoes_minha_lista %}
        <button class="btn btn-sm btn-alternar btn-alternar--lista" type="submit" title="Remover da Minha Lista" aria-pressed="true"><i class="bi bi-star-fill" aria-hidden="true"></i> <span>Na Minha Lista</span></button>
    {% else %}
        <button class="btn btn-sm btn-alternar btn-alternar--lista" type="submit" title="Adicionar à Minha Lista" aria-pressed="false"><i class="bi bi-star" aria-hidden="true"></i> <span>Minha Lista</span></button>
    {% endif %}
</form>
