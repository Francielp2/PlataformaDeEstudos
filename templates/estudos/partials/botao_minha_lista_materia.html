<form method="post" action="{% url 'estudos:alternar_materia_minha_lista' materia.pk %}" class="d-inline">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    {% if materia.pk in ids_materias_minha_lista %}
        <button class="btn btn-sm btn-outline-secondary" type="submit" title="Remover da Minha Lista"><i class="bi bi-star-fill"></i> Na Minha Lista</button>
    {% else %}
        <button class="btn btn-sm btn-outline-primary" type="submit" title="Adicionar à Minha Lista"><i class="bi bi-star"></i> Minha Lista</button>
    {% endif %}
</form>
