{% comment %}Chip de status de publicação (draft/published/archived). Parâmetros: valor, rotulo.{% endcomment %}{% if valor == "published" %}<span class="chip tom-menta"><i class="bi bi-broadcast" aria-hidden="true"></i> {{ rotulo }}</span>{% elif valor == "archived" %}<span class="chip tom-neutro"><i class="bi bi-archive" aria-hidden="true"></i> {{ rotulo }}</span>{% else %}<span class="chip tom-sol"><i class="bi bi-pencil" aria-hidden="true"></i> {{ rotulo }}</span>{% endif %}
